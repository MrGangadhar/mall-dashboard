<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mall Analytics - Comparison Dashboard. Compare mall performance across months.">
    <title>Mall Analytics - Comparison Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper" id="comparisonDashboard">
        <nav class="top-navbar shadow-sm bg-white py-2 px-4 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="navbar-brand text-decoration-none d-flex align-items-center">
                    <i class="fas fa-store-alt text-primary fa-lg me-2"></i>
                    <span class="fw-bold text-dark fs-5">Mall Analytics</span>
                    <small class="ms-2 text-muted d-none d-lg-inline">Comparison Dashboard</small>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="dashboard.html" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-arrow-left me-1"></i><span class="d-none d-sm-inline">Back to Dashboard</span>
                    </a>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="logout()" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-3 px-md-4 py-3 py-md-4">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="insight-header">
                        <h4 class="mb-1"><i class="fas fa-balance-scale text-primary me-2"></i>Month-over-Month Comparison</h4>
                        <p class="mb-0">Compare sales and operational performance metrics between two selected months.</p>
                    </div>
                </div>
            </div>

            <!-- Filters Section -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Select Mall</label>
                                    <select class="form-select" id="compareMallSelect">
                                        <option value="">All Malls</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Month 1</label>
                                    <input type="month" class="form-control" id="month1">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Month 2</label>
                                    <input type="month" class="form-control" id="month2">
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-primary w-100" onclick="if(window.comparisonDashboard) window.comparisonDashboard.compare()">
                                        <i class="fas fa-exchange-alt me-1"></i>Compare
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="row g-3 g-md-4 mb-4">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-chart-bar me-2 text-primary"></i>Sales Comparison</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container" style="height: 350px;">
                                <canvas id="comparisonChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="spinner-overlay" style="display: none;"><div class="spinner"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/shared/api.js" defer></script>
    <script src="js/shared/utils.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/dashboards/comparison.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.comparisonDashboard = new ComparisonDashboard();
        });
    </script>
</body>
</html>
