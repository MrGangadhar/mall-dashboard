<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mall Analytics - Rent Dashboard. Track rent collection, pending payments and tenant billing.">
    <title>Mall Analytics - Rent Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper" id="rentDashboard">
        <nav class="top-navbar">
            <div class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="navbar-brand">
                    <i class="fas fa-store-alt"></i>
                    <span>Mall Analytics</span>
                    <small class="ms-2 d-none d-lg-inline">Rent Dashboard</small>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="dashboard.html" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-arrow-left me-1"></i><span class="d-none d-sm-inline">Back to Dashboard</span>
                    </a>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="logout()" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-3 px-md-4 py-3 py-md-4">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="insight-header">
                        <h4 class="mb-1"><i class="fas fa-file-invoice-dollar text-primary me-2"></i>Rent Analytics</h4>
                        <p class="mb-0">Monitor rent collection status, pending payments, and tenant billing across all malls.</p>
                    </div>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="row g-3 g-md-4 mb-4">
                <div class="col-6 col-md-4">
                    <div class="stat-card text-center">
                        <div class="stat-icon mx-auto"><i class="fas fa-rupee-sign"></i></div>
                        <p class="stat-label mt-2">Total Rent</p>
                        <h3 class="stat-value" id="totalRent">₹0</h3>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="stat-card text-center">
                        <div class="stat-icon mx-auto"><i class="fas fa-exclamation-triangle"></i></div>
                        <p class="stat-label mt-2">Pending</p>
                        <h3 class="stat-value" id="pendingRent">0</h3>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="stat-card text-center">
                        <div class="stat-icon mx-auto"><i class="fas fa-check-circle"></i></div>
                        <p class="stat-label mt-2">Collection Rate</p>
                        <h3 class="stat-value" id="collectionRateRent">0%</h3>
                    </div>
                </div>
            </div>

            <!-- Rent Chart -->
            <div class="row g-3 g-md-4 mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-chart-pie me-2 text-warning"></i>Rent Collection Status</h5>
                            <button class="btn btn-sm btn-outline-warning" id="refreshRentBtn"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
                        </div>
                        <div class="card-body">
                            <div class="chart-container"><canvas id="rentStatusChart"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rent Table -->
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-table me-2 text-info"></i>Rent Records</h5>
                        </div>
                        <div class="card-body p-0 p-sm-3">
                            <div class="table-responsive">
                                <table class="table data-table mb-0" id="rentTable">
                                    <thead>
                                        <tr><th>Month</th><th>Mall</th><th>Brand</th><th class="text-end">Rent</th><th>Status</th></tr>
                                    </thead>
                                    <tbody>
                                        <tr><td colspan="5" class="text-center text-muted py-4"><i class="fas fa-inbox fa-2x mb-3 d-block"></i>Loading rent data...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="spinner-overlay" style="display: none;"><div class="spinner"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/shared/api.js" defer></script>
    <script src="js/shared/utils.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/dashboards/rent.js" defer></script>
</body>
</html>
