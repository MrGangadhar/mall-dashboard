version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mall_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mall_db
      MYSQL_USER: mall_user
      MYSQL_PASSWORD: mall_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mall_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: mall_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mall_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://mall_user:mall_password@mysql:3306/mall_db
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./templates:/app/templates
    depends_on:
      - mysql
      - redis
    networks:
      - mall_network

  frontend:
    image: nginx:alpine
    container_name: mall_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - mall_network

volumes:
  mysql_data:
  redis_data:

networks:
  mall_network:
    driver: bridge